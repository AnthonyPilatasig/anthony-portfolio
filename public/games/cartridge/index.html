<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Intérprete WebAssembly — AP-Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="shortcut icon" href="media/retroarch.ico" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050811;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #e2e8f0;
    user-select: none;
  }

  /* ── Dedicated Emulator Sandboxed Frame ──────────────────────────── */
  #emulator-frame {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: 0;
    background: #000000;
    z-index: 10;
    display: none;
  }

  /* ── Top Floating Command Bar ────────────────────────────────────── */
  .top-command-bar {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(10, 14, 26, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    backdrop-filter: blur(20px);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  .hud-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #cbd5e1;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .hud-btn.primary {
    background: #f43f5e;
    color: #ffffff;
    border-color: #f43f5e;
    box-shadow: 0 0 20px rgba(244, 63, 94, 0.5);
  }

  .hud-btn.primary:hover {
    background: #e11d48;
    transform: scale(1.04);
    box-shadow: 0 0 28px rgba(244, 63, 94, 0.7);
  }

  .hud-btn:hover:not(.primary) {
    background: rgba(255, 255, 255, 0.18);
    color: #ffffff;
  }

  /* ── Initial Selection Card Overlay ──────────────────────────────── */
  .rom-prompt-overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, #111827 0%, #050811 100%);
    padding: 20px;
    transition: opacity 0.3s ease;
  }

  .rom-prompt-overlay.hidden {
    display: none !important;
  }

  .rom-prompt-card {
    max-width: 500px;
    width: 100%;
    background: #0f172a;
    border: 2px dashed rgba(244, 63, 94, 0.45);
    border-radius: 28px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 50px rgba(244, 63, 94, 0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }

  .rom-prompt-card:hover, .rom-prompt-card.dragover {
    border-color: #f43f5e;
    background: rgba(244, 63, 94, 0.06);
    transform: scale(1.02);
  }

  .prompt-icon {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: rgba(244, 63, 94, 0.15);
    border: 1px solid rgba(244, 63, 94, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f43f5e;
    font-size: 30px;
    box-shadow: 0 0 25px rgba(244, 63, 94, 0.25);
  }

  .prompt-title {
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.01em;
  }

  .prompt-desc {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.5;
    max-width: 380px;
  }

  .btn-select-rom {
    background: #ffffff;
    color: #0f172a;
    font-weight: 800;
    font-size: 13px;
    padding: 13px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    margin-top: 4px;
  }

  .btn-select-rom:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(255, 255, 255, 0.5);
  }

  .slot-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 6px;
  }

  .slot-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    color: #cbd5e1;
  }

  /* ── Loading Spinner ─────────────────────────────────────────────── */
  .loader-spinner {
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    color: #f43f5e;
    margin-top: 8px;
  }

  .loader-spinner.active {
    display: flex;
  }

  /* ── Toast Notification ──────────────────────────────────────────── */
  .toast-notify {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(50px);
    opacity: 0;
    background: rgba(15, 23, 42, 0.96);
    border: 1px solid rgba(244, 63, 94, 0.4);
    color: #ffffff;
    padding: 8px 22px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 9999999;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toast-notify.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<!-- ── Dedicated Emulator Sandboxed Frame ──────────────────────────── -->
<iframe id="emulator-frame" allow="autoplay; fullscreen; gamepad"></iframe>

<!-- ── Top Floating Command Bar ────────────────────────────────────── -->
<div class="top-command-bar" id="commandBar" style="display:none;">
  <button class="hud-btn primary" id="btnChangeFile">
    <i class="fa fa-folder-open"></i> Cargar Otro Archivo
  </button>
  <button class="hud-btn" id="btnRestartGame" title="Reiniciar Partida">
    <i class="fa fa-rotate-left"></i> Reiniciar
  </button>
  <button class="hud-btn" id="btnFullscreen" title="Pantalla Completa">
    <i class="fa fa-expand"></i> Pantalla Completa
  </button>
</div>

<!-- ── Initial Selection Card Overlay ──────────────────────────────── -->
<div class="rom-prompt-overlay" id="romPromptOverlay">
  <div class="rom-prompt-card" id="promptCard">
    <div class="prompt-icon">
      <i class="fa fa-microchip"></i>
    </div>
    <h2 class="prompt-title">Intérprete WebAssembly</h2>
    <p class="prompt-desc">
      Arrastra y suelta tu archivo personal (<strong>.gba</strong>, <strong>.gbc</strong>, <strong>.nes</strong>, <strong>.zip</strong>) o haz clic para ejecutarlo en el navegador.
    </p>

    <button class="btn-select-rom" id="btnPromptPick" type="button">
      <i class="fa fa-arrow-up-from-bracket"></i> Seleccionar Archivo desde tu PC
    </button>

    <div class="loader-spinner" id="loaderSpinner">
      <i class="fa fa-spinner fa-spin"></i>
      <span id="loaderSpinnerText">Iniciando motor de juego...</span>
    </div>

    <div class="slot-tags">
      <span class="slot-tag">Compatible PC y Móvil</span>
      <span class="slot-tag">100% Local en Navegador</span>
      <span class="slot-tag">Guardado Automático</span>
    </div>
  </div>
</div>

<!-- ── Toast ───────────────────────────────────────────────────────── -->
<div class="toast-notify" id="toastNotify">
  <i class="fa fa-circle-check text-emerald-400"></i>
  <span id="toastMsg">Archivo cargado</span>
</div>

<input style="display:none" type="file" id="fileInput" name="upload" accept=".gba,.gb,.gbc,.nes,.zip,.bin,.rom" />

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  let currentGameBlobUrl = null;
  let currentFile = null;

  function showToast(msg) {
    $('#toastMsg').text(msg);
    $('#toastNotify').addClass('show');
    setTimeout(() => $('#toastNotify').removeClass('show'), 3500);
  }

  function detectCore(filename) {
    const ext = filename.split('.').pop().toLowerCase();
    if (ext === 'gba') return 'gba';
    if (ext === 'gb' || ext === 'gbc') return 'gbc';
    if (ext === 'nes') return 'nes';
    if (ext === 'sfc' || ext === 'smc') return 'snes';
    if (ext === 'md' || ext === 'bin') return 'segaMD';
    return 'gba';
  }

  function launchGame(file) {
    if (!file) return;
    currentFile = file;
    const core = detectCore(file.name);
    console.log("AP-Deck: Booting game", file.name, "with core:", core, "size:", file.size);

    $('#loaderSpinner').addClass('active');
    $('#loaderSpinnerText').text(`Iniciando ${file.name}...`);
    showToast(`Cargando ${file.name}...`);

    if (currentGameBlobUrl) {
      URL.revokeObjectURL(currentGameBlobUrl);
    }
    currentGameBlobUrl = URL.createObjectURL(file);

    // Hide prompt overlay and show isolated frame & top HUD
    $('#romPromptOverlay').addClass('hidden');
    $('#commandBar').show();
    const frame = document.getElementById('emulator-frame');
    frame.style.display = 'block';

    // Generate isolated, clean HTML runner inside the iframe srcdoc
    const runnerHtml = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000000;
  }
  #game {
    width: 100vw;
    height: 100vh;
    position: absolute;
    inset: 0;
  }
</style>
</head>
<body>
<div id="game"></div>
<script>
  window.EJS_player = '#game';
  window.EJS_core = '${core}';
  window.EJS_gameUrl = '${currentGameBlobUrl}';
  window.EJS_gameName = ${JSON.stringify(file.name)};
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_color = '#F43F5E';
  window.EJS_backgroundColor = '#000000';
  window.EJS_volume = 1.0;
  window.EJS_fullscreenOnLoad = false;
  window.EJS_hideControlBar = false;
<\/script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/script>
</body>
</html>`;

    frame.srcdoc = runnerHtml;
    $('#loaderSpinner').removeClass('active');
  }

  $(function() {
    // File input handlers
    $('#btnPromptPick, #promptCard, #btnChangeFile').click(function(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
        e.stopPropagation();
      }
      $('#fileInput').click();
    });

    $('#fileInput').change(function(e) {
      if (e.target.files && e.target.files.length > 0) {
        launchGame(e.target.files[0]);
      }
    });

    // Drag and Drop anywhere on the window
    const dropCard = $('#promptCard');
    $(window).on('dragover dragenter', function(e) {
      e.preventDefault();
      e.stopPropagation();
      dropCard.addClass('dragover');
    });

    $(window).on('dragleave dragend drop', function(e) {
      e.preventDefault();
      e.stopPropagation();
      dropCard.removeClass('dragover');
      if (e.type === 'drop') {
        const dt = e.originalEvent ? e.originalEvent.dataTransfer : e.dataTransfer;
        if (dt && dt.files && dt.files.length > 0) {
          launchGame(dt.files[0]);
        }
      }
    });

    // In-Game HUD buttons
    $('#btnRestartGame').click(function() {
      if (currentFile) {
        launchGame(currentFile);
        showToast("Partida reiniciada");
      }
    });

    $('#btnFullscreen').click(function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Parent communication (from ConsoleDashboard.tsx)
    window.addEventListener('message', function(e) {
      if (!e.data) return;
      if (e.data.type === 'PICK_ROM') {
        $('#fileInput').click();
      }
      if (e.data.type === 'LOAD_ROM_DATA' && e.data.data && e.data.name) {
        const blob = new Blob([e.data.data], { type: 'application/octet-stream' });
        const file = new File([blob], e.data.name);
        launchGame(file);
      }
    });
  });
</script>
</body>
</html>
