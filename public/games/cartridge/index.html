<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Ranura de Emulación Virtual — AP-Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="shortcut icon" href="media/retroarch.ico" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #e2e8f0;
    user-select: none;
  }

  /* ── Canvas: Edge-to-Edge Widescreen Display ─────────────────────── */
  #canvas {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    image-rendering: pixelated;
    background: #000000;
    display: none;
    z-index: 10;
  }

  /* ── Floating Minimal In-Game Control HUD (Appears on hover) ──────── */
  .ingame-hud {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) translateY(-60px);
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(10, 14, 26, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    opacity: 0;
    pointer-events: none;
  }

  body:hover .ingame-hud, .ingame-hud:hover, .ingame-hud.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .hud-btn {
    background: rgba(255, 255, 255, 0.08);
    border: none;
    color: #cbd5e1;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s, color 0.2s;
  }

  .hud-btn:hover {
    background: rgba(255, 255, 255, 0.18);
    color: #ffffff;
  }

  /* ── Fullscreen Drag & Drop Slot Loader Overlay ─────────────────── */
  .slot-loader {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, #111827 0%, #050811 100%);
    padding: 24px;
    text-align: center;
    transition: opacity 0.4s ease;
  }

  .slot-loader.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .slot-box {
    max-width: 520px;
    width: 100%;
    background: rgba(17, 24, 39, 0.75);
    border: 2px dashed rgba(244, 63, 94, 0.4);
    border-radius: 28px;
    padding: 40px 30px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 60px -15px rgba(244, 63, 94, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transition: border-color 0.2s, transform 0.2s, background 0.2s;
    cursor: pointer;
  }

  .slot-box:hover, .slot-box.dragover {
    border-color: #f43f5e;
    background: rgba(244, 63, 94, 0.08);
    transform: scale(1.02);
  }

  .slot-icon {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: rgba(244, 63, 94, 0.15);
    border: 1px solid rgba(244, 63, 94, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f43f5e;
    font-size: 28px;
    box-shadow: 0 0 30px rgba(244, 63, 94, 0.25);
  }

  .slot-title {
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.02em;
  }

  .slot-subtitle {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.5;
    max-width: 380px;
  }

  .btn-upload {
    margin-top: 8px;
    background: #ffffff;
    color: #0f172a;
    font-weight: 800;
    font-size: 13px;
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-upload:hover {
    transform: scale(1.04);
    box-shadow: 0 0 35px rgba(255, 255, 255, 0.35);
  }

  .slot-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 4px;
  }

  .slot-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    color: #cbd5e1;
  }

  /* Status spinner */
  .loader-spinner {
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    color: #f43f5e;
    margin-top: 10px;
  }

  .loader-spinner.active {
    display: flex;
  }
</style>
</head>
<body>

<!-- ── Canvas Fullscreen Element ────────────────────────────────────── -->
<canvas id="canvas" class="webplayer"></canvas>

<!-- ── In-Game Floating HUD (Shows on hover during gameplay) ────────── -->
<div class="ingame-hud" id="ingameHud">
  <button class="hud-btn" id="btnChangeGame">
    <i class="fa fa-folder-open"></i> Cargar otro archivo
  </button>
  <button class="hud-btn" id="btnResetGame">
    <i class="fa fa-rotate-left"></i> Reiniciar
  </button>
  <button class="hud-btn" id="btnHudFullscreen">
    <i class="fa fa-expand"></i> Pantalla completa
  </button>
  <button class="hud-btn" id="btnCleanStorage" title="Borrar datos guardados">
    <i class="fa fa-trash-can"></i> Limpiar datos
  </button>
</div>

<!-- ── Fullscreen Slot Loader Overlay (Initial Screen) ──────────────── -->
<div class="slot-loader" id="slotLoader">
  <div class="slot-box" id="dropBox">
    <div class="slot-icon">
      <i class="fa fa-microchip"></i>
    </div>
    <h2 class="slot-title">Ranura de Emulación Virtual</h2>
    <p class="slot-subtitle">
      Arrastra y suelta tu archivo personal (<strong>.gba</strong>, <strong>.gbc</strong>, <strong>.nes</strong>, <strong>.zip</strong>) o haz clic para cargarlo en memoria.
    </p>

    <button class="btn-upload" id="btnPickFile" type="button">
      <i class="fa fa-arrow-up-from-bracket"></i> Seleccionar Archivo
    </button>

    <div class="loader-spinner" id="loaderSpinner">
      <i class="fa fa-spinner fa-spin"></i>
      <span id="loaderSpinnerText">Iniciando núcleo de emulación...</span>
    </div>

    <div class="slot-tags">
      <span class="slot-tag">Núcleos Libretro WASM</span>
      <span class="slot-tag">100% Local en Navegador</span>
      <span class="slot-tag">Guardado Automático</span>
    </div>
  </div>
</div>

<input style="display:none" type="file" id="btnRom" name="upload" accept=".gba,.gb,.gbc,.nes,.zip,.bin,.rom" />

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="browserfs.min.js"></script>
<script src="core_list.js"></script>
<script src="libretro.js"></script>
</body>
</html>
