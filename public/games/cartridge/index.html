<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Intérprete WebAssembly — AP-Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="shortcut icon" href="media/retroarch.ico" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #e2e8f0;
    user-select: none;
  }

  /* ── Canvas: Fullscreen Edge-to-Edge ─────────────────────────────── */
  #canvas {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    image-rendering: pixelated;
    background: #000000;
    display: block;
    z-index: 10;
  }

  /* ── Sleek Top Floating Command Bar ──────────────────────────────── */
  .top-command-bar {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(10, 14, 26, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 999px;
    backdrop-filter: blur(20px);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .hud-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #cbd5e1;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .hud-btn.primary {
    background: #ffffff;
    color: #0f172a;
    border-color: #ffffff;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
  }

  .hud-btn.primary:hover {
    background: #f8fafc;
    transform: scale(1.04);
    box-shadow: 0 0 28px rgba(255, 255, 255, 0.4);
  }

  .hud-btn:hover:not(.primary) {
    background: rgba(255, 255, 255, 0.18);
    color: #ffffff;
  }

  /* ── Initial Loading Splash ──────────────────────────────────────── */
  .init-splash {
    position: absolute;
    inset: 0;
    z-index: 25;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #050811;
    color: #94a3b8;
    gap: 16px;
    transition: opacity 0.4s ease;
  }

  .init-splash.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .spinner-icon {
    font-size: 32px;
    color: #f43f5e;
  }

  /* ── Toast Notification ──────────────────────────────────────────── */
  .toast-notify {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(50px);
    opacity: 0;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(244, 63, 94, 0.4);
    color: #ffffff;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toast-notify.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<!-- ── Canvas: RetroArch Widescreen Surface ────────────────────────── -->
<canvas id="canvas" class="webplayer"></canvas>

<!-- ── Top Floating Command Bar (Always on Top) ────────────────────── -->
<div class="top-command-bar" id="commandBar">
  <button class="hud-btn primary" id="btnPickFile">
    <i class="fa fa-folder-open"></i> Cargar Archivo (.gba, .gbc, .nes, .zip)
  </button>
  <button class="hud-btn" id="btnResetGame" title="Reiniciar">
    <i class="fa fa-rotate-left"></i> Reiniciar
  </button>
  <button class="hud-btn" id="btnHudFullscreen" title="Pantalla Completa">
    <i class="fa fa-expand"></i> Pantalla Completa
  </button>
  <button class="hud-btn" id="btnCleanStorage" title="Borrar Partidas Guardadas">
    <i class="fa fa-trash-can"></i> Limpiar Datos
  </button>
</div>

<!-- ── Initial Startup Splash (Hides when WASM boots) ──────────────── -->
<div class="init-splash" id="initSplash">
  <i class="fa fa-circle-notch fa-spin spinner-icon"></i>
  <span style="font-size: 14px; font-weight: 600; color: #e2e8f0;">Iniciando Entorno WebAssembly...</span>
  <span style="font-size: 11px; color: #64748b;">Preparando sistema de archivos y núcleos en memoria</span>
</div>

<!-- ── Toast ───────────────────────────────────────────────────────── -->
<div class="toast-notify" id="toastNotify">
  <i class="fa fa-circle-check text-emerald-400"></i>
  <span id="toastMsg">Archivo cargado con éxito</span>
</div>

<input style="display:none" type="file" id="btnRom" name="upload" accept=".gba,.gb,.gbc,.nes,.zip,.bin,.rom" />

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="browserfs.min.js"></script>
<script src="core_list.js"></script>
<script src="libretro.js"></script>
</body>
</html>
