<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Intérprete WebAssembly Universal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #050811; color: #fff; font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    #cartridge-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; background: #000; overflow: hidden;
    }
    #commandBar {
      display: none; position: absolute; top: 10px; right: 10px; z-index: 40;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 999px;
      padding: 4px 10px; align-items: center; gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: opacity 0.2s, transform 0.2s;
    }
    @media (max-height: 500px), (max-width: 640px) {
      #commandBar { top: 6px; right: 6px; padding: 3px 8px; gap: 6px; }
      #commandBar .btn-hud span { display: none; }
      .hud-chip { display: none; }
    }
    .hud-chip {
      background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fca5a5; padding: 4px 10px; border-radius: 999px;
      font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 5px;
    }
    .btn-hud {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff; padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;
    }
    .btn-hud:hover { background: rgba(255, 255, 255, 0.18); }
    .btn-hud-primary {
      background: #f43f5e; border-color: #f43f5e; color: #fff; font-weight: 700;
    }
    .btn-hud-primary:hover { background: #e11d48; }

    #emulator-viewport {
      position: relative; flex: 1; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center; background: #000;
    }
    #game-frame {
      width: 100%; height: 100%; border: none; display: none;
    }

    #romPromptOverlay {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      background: radial-gradient(circle at 50% 50%, #0f172a 0%, #050811 100%);
    }
    .prompt-card {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 28px;
      padding: 36px 32px; max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .prompt-icon {
      width: 68px; height: 68px; border-radius: 20px;
      background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
      color: #f43f5e; font-size: 28px;
    }
    .prompt-card h2 { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .prompt-card p { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
    .badge-cloud { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 24px; }
    .badge-item {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; color: #cbd5e1;
    }
    .btn-pick-rom {
      background: #f43f5e; color: #fff; border: none; border-radius: 999px;
      padding: 12px 28px; font-size: 13px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 10px 25px rgba(244, 63, 94, 0.35);
      transition: all 0.2s;
    }
    .btn-pick-rom:hover { background: #e11d48; transform: translateY(-1px); }

    #loaderSpinner {
      position: absolute; inset: 0; z-index: 25;
      display: none; align-items: center; justify-content: center;
      background: rgba(5, 8, 17, 0.9); backdrop-filter: blur(10px);
      flex-direction: column; gap: 14px;
    }
    #loaderSpinner.active { display: flex; }
    .spinner-disc {
      width: 48px; height: 48px; border: 4px solid rgba(244, 63, 94, 0.2);
      border-top-color: #f43f5e; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="cartridge-container">
  <input type="file" id="fileInput" accept=".nds,.z64,.n64,.iso,.cue,.chd,.pbp,.sfc,.smc,.md,.gen,.nes,.gba,.gbc,.zip" style="display:none;">

  <div id="commandBar">
    <div class="hud-chip">
      <i class="fa fa-microchip"></i>
      <span id="activeCoreBadge">WASM Core</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="btn-hud btn-hud-primary" id="btnChangeFile" title="Cargar Otro ROM">
        <i class="fa fa-folder-open"></i> <span>Cargar ROM</span>
      </button>
      <button class="btn-hud" id="btnRestart" title="Reiniciar">
        <i class="fa fa-rotate-right"></i> <span>Reiniciar</span>
      </button>
      <button class="btn-hud" id="btnFullscreen" title="Pantalla Completa">
        <i class="fa fa-expand"></i> <span>Pantalla Completa</span>
      </button>
    </div>
  </div>

  <div id="emulator-viewport">
    <iframe id="game-frame" allow="autoplay; gamepad; fullscreen; cross-origin-isolated"></iframe>

    <div id="loaderSpinner">
      <div class="spinner-disc"></div>
      <p style="font-size:12px; font-weight:700; color:#e2e8f0;" id="spinnerText">Iniciando Núcleo WebAssembly...</p>
    </div>

    <div id="romPromptOverlay">
      <div class="prompt-card">
        <div class="prompt-icon"><i class="fa fa-gamepad"></i></div>
        <h2>Cargar ROM Multi-Consola</h2>
        <p>Auto-detección instantánea de núcleo WASM para Nintendo DS, PS1, N64, GBA, SNES, Genesis, NES y Arcade.</p>
        <div class="badge-cloud">
          <span class="badge-item">GBA (.gba)</span>
          <span class="badge-item">NDS (.nds)</span>
          <span class="badge-item">PS1 (.iso/.chd)</span>
          <span class="badge-item">N64 (.z64)</span>
          <span class="badge-item">SNES (.sfc)</span>
          <span class="badge-item">Genesis (.md)</span>
        </div>
        <button class="btn-pick-rom" id="btnPromptPick">
          <i class="fa fa-upload"></i> Seleccionar ROM
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  const CORE_MAP = {
    'nds': { core: 'nds', name: 'Nintendo DS (DeSmuME WASM)' },
    'z64': { core: 'n64', name: 'Nintendo 64 (Mupen64Plus)' },
    'n64': { core: 'n64', name: 'Nintendo 64 (Mupen64Plus)' },
    'iso': { core: 'psx', name: 'Sony PlayStation 1 (PCSX-ReARMed)' },
    'chd': { core: 'psx', name: 'Sony PlayStation 1 (PCSX-ReARMed)' },
    'cue': { core: 'psx', name: 'Sony PlayStation 1 (PCSX-ReARMed)' },
    'sfc': { core: 'snes', name: 'Super Nintendo (Snes9x)' },
    'smc': { core: 'snes', name: 'Super Nintendo (Snes9x)' },
    'md':  { core: 'segaMD', name: 'Sega Genesis (Genesis Plus GX)' },
    'gen': { core: 'segaMD', name: 'Sega Genesis (Genesis Plus GX)' },
    'nes': { core: 'nes', name: 'Nintendo NES (Nestopia)' },
    'gba': { core: 'gba', name: 'Game Boy Advance (mGBA)' },
    'gbc': { core: 'gbc', name: 'Game Boy Color (Gearboy)' }
  };

  let currentBlobUrl = null;
  let currentFile = null;

  async function detectCore(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext !== 'zip') return CORE_MAP[ext] || { core: 'gba', name: 'Game Boy Advance' };

    try {
      const zip = new JSZip();
      const zipLoaded = await zip.loadAsync(file);
      for (const p of Object.keys(zipLoaded.files)) {
        const subExt = p.split('.').pop().toLowerCase();
        if (CORE_MAP[subExt]) return CORE_MAP[subExt];
      }
    } catch(e){}
    return { core: 'gba', name: 'Game Boy Advance' };
  }

  async function launchGame(file) {
    currentFile = file;
    $('#loaderSpinner').addClass('active');
    const coreInfo = await detectCore(file);

    $('#activeCoreBadge').text(coreInfo.name);
    $('#romPromptOverlay').hide();
    $('#commandBar').css('display', 'flex');

    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = URL.createObjectURL(file);

    const frame = document.getElementById('game-frame');
    frame.style.display = 'block';

    const runnerHtml = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #game { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
</style>
</head>
<body>
<div id="game"></div>
<script>
  window.EJS_player = '#game';
  window.EJS_core = '${coreInfo.core}';
  window.EJS_gameUrl = '${currentBlobUrl}';
  window.EJS_gameName = ${JSON.stringify(file.name)};
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_color = '#F43F5E';
  window.EJS_backgroundColor = '#000000';
  window.EJS_volume = 1.0;
<\/script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/script>
</body>
</html>`;

    frame.srcdoc = runnerHtml;
    $('#loaderSpinner').removeClass('active');
  }

  $(function() {
    $('#btnPromptPick, #btnChangeFile').click(function() {
      $('#fileInput').click();
    });

    $('#fileInput').change(function(e) {
      const file = e.target.files && e.target.files[0];
      if (file) launchGame(file);
    });

    $('#btnRestart').click(function() {
      if (currentFile) launchGame(currentFile);
    });

    $('#btnFullscreen').click(function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen().catch(()=>{});
      }
    });

    window.addEventListener('message', function(e) {
      if (!e.data) return;
      if (e.data.type === 'LOAD_ROM_DATA' && e.data.data && e.data.name) {
        const blob = new Blob([e.data.data], { type: 'application/octet-stream' });
        const file = new File([blob], e.data.name);
        launchGame(file);
      }
    });
  });
</script>
</body>
</html>
