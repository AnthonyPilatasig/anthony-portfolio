<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad5)"/>
  
  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#1E293B" fill-opacity="0.95" stroke="#475569" stroke-width="1"/>
  
  <!-- Logo & Title -->
  <rect x="24" y="16" width="38" height="38" rx="8" fill="url(#amberGrad)" />
  <text x="36" y="41" font-family="Inter, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">⚠️</text>
  <text x="74" y="36" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#FEF3C7">AVIALB • SIAT MÓVIL</text>
  <text x="74" y="52" font-family="JetBrains Mono, monospace" font-size="11" fill="#FDE68A">Sistema de Peritaje e Inspección Vial Offline-First</text>

  <!-- Status badges top right -->
  <rect x="910" y="20" width="140" height="30" rx="6" fill="#78350F" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1"/>
  <circle cx="925" cy="35" r="4" fill="#FBBF24" />
  <text x="937" y="40" font-family="JetBrains Mono, monospace" font-weight="600" font-size="11" fill="#FDE68A">OFFLINE SYNC QUEUE</text>

  <!-- Main Content Area -->
  <g transform="translate(40, 95)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="260" height="90" rx="12" fill="url(#cardGrad5)" stroke="#475569" stroke-width="1"/>
    <text x="16" y="28" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Inspecciones Levantadas</text>
    <text x="16" y="62" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#F8FAFC">540+</text>

    <!-- Stat 2 -->
    <rect x="285" y="0" width="260" height="90" rx="12" fill="url(#cardGrad5)" stroke="#475569" stroke-width="1"/>
    <text x="301" y="28" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Disponibilidad en Campo</text>
    <text x="301" y="62" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#34D399">100% Sin Red</text>

    <!-- Stat 3 -->
    <rect x="570" y="0" width="260" height="90" rx="12" fill="url(#cardGrad5)" stroke="#475569" stroke-width="1"/>
    <text x="586" y="28" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Fotos y Croquis GPS</text>
    <text x="586" y="62" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#38BDF8">SQLite Local</text>

    <!-- Stat 4 -->
    <rect x="855" y="0" width="260" height="90" rx="12" fill="url(#cardGrad5)" stroke="#475569" stroke-width="1"/>
    <text x="871" y="28" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Sincronización Automática</text>
    <text x="871" y="62" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#FBBF24">Background</text>
  </g>

  <!-- Big Inspection Map & Case Card -->
  <g transform="translate(40, 205)">
    <rect x="0" y="0" width="1120" height="440" rx="14" fill="url(#cardGrad5)" stroke="#475569" stroke-width="1"/>
    <text x="24" y="35" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#FEF3C7">Módulo de Levantamiento de Siniestros y Peritaje Técnico</text>
    <text x="24" y="55" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Captura de evidencia fotográfica geolocalizada, diagrama vectorial de colisión y colas de sincronización asíncronas</text>

    <!-- Architecture Box -->
    <g transform="translate(24, 85)">
      <rect x="0" y="0" width="1072" height="325" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="24" y="36" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#FBBF24">OFFLINE-FIRST ARCHITECTURE: SQLite Local DB + Background Sync Queue</text>
      
      <text x="24" y="70" font-family="Inter, sans-serif" font-size="13" fill="#E2E8F0">
        1. Almacenamiento local de auditoría en SQLite: El perito ingresa datos, croquis vectorial y fotos sin conexión a internet.
      </text>
      <text x="24" y="105" font-family="Inter, sans-serif" font-size="13" fill="#E2E8F0">
        2. Worker de sincronización en segundo plano: Al detectar conexión WiFi o 4G/LTE, los paquetes se cifran y envían al backend en .NET Core.
      </text>
      <text x="24" y="140" font-family="Inter, sans-serif" font-size="13" fill="#E2E8F0">
        3. Manejo de idempotencia y resolución de conflictos: Cada informe cuenta con UUID v4 único e inmutable para evitar duplicados.
      </text>
      <text x="24" y="175" font-family="Inter, sans-serif" font-size="13" fill="#E2E8F0">
        4. Generación automatizada de informe pericial con firmas periciales y cadena de custodia probatoria.
      </text>
    </g>
  </g>
</svg>
