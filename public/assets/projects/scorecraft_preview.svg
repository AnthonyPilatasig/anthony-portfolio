    <text x="706" y="28" font-family="Inter, sans-serif" font-size="12" fill="#A7F3D0">Partidos Analizados</text>
    <text x="706" y="62" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#FBBF24">42</text>
  </g>

