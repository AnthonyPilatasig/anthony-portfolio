  <text x="36" y="41" font-family="Inter, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">⚽</text>
  <text x="74" y="36" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#ECFDF5">SCORECRAFT • CDMI</text>
  <text x="74" y="52" font-family="JetBrains Mono, monospace" font-size="11" fill="#6EE7B7">Plataforma de Rendimiento Deportivo &amp; Fichas Médicas</text>

  <!-- Sidebar (Left) -->
  <rect x="0" y="70" width="240" height="605" fill="#021C16" stroke="#064E3B" stroke-width="1"/>
  <g transform="translate(18, 90)">
    <rect x="0" y="30" width="204" height="40" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="1"/>
    <text x="15" y="55" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#34D399">🏃‍♂️ Plantilla de Jugadores</text>
    <text x="15" y="98" font-family="Inter, sans-serif" font-size="13" fill="#A7F3D0">🩺 Fichas Antropométricas</text>
    <text x="15" y="138" font-family="Inter, sans-serif" font-size="13" fill="#A7F3D0">⏱️ Carga de Entrenamientos</text>
    <text x="15" y="178" font-family="Inter, sans-serif" font-size="13" fill="#A7F3D0">📊 Estadísticas de Partidos</text>
    <text x="15" y="218" font-family="Inter, sans-serif" font-size="13" fill="#A7F3D0">🩹 Historial de Lesiones</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(265, 95)">
