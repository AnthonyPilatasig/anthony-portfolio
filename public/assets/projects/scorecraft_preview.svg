    <rect x="0" y="0" width="215" height="90" rx="12" fill="url(#cardGrad4)" stroke="#065F46" stroke-width="1"/>
    <text x="16" y="28" font-family="Inter, sans-serif" font-size="12" fill="#A7F3D0">Jugadores Fichados</text>
    <text x="16" y="62" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#ECFDF5">128</text>

    <!-- Stat 2 -->
    <rect x="230" y="0" width="215" height="90" rx="12" fill="url(#cardGrad4)" stroke="#065F46" stroke-width="1"/>
    <text x="246" y="28" font-family="Inter, sans-serif" font-size="12" fill="#A7F3D0">Fichas Médicas 100%</text>
    <text x="246" y="62" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#34D399">128 / 128</text>

    <!-- Stat 3 -->
    <rect x="460" y="0" width="215" height="90" rx="12" fill="url(#cardGrad4)" stroke="#065F46" stroke-width="1"/>
    <text x="476" y="28" font-family="Inter, sans-serif" font-size="12" fill="#A7F3D0">Índice Disponibilidad</text>
    <text x="476" y="62" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#6EE7B7">96.4%</text>

    <!-- Stat 4 -->
