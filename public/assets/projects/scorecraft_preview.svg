    <text x="24" y="35" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#ECFDF5">Monitoreo Físico y Perfil Antropométrico</text>
    <text x="24" y="55" font-family="Inter, sans-serif" font-size="12" fill="#A7F3D0">Seguimiento de VO2 Max, pliegues cutáneos y rendimiento por posición</text>

