    <text x="35" y="98" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#34D399">JUGADOR / DORSAL</text>
    <text x="260" y="98" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#34D399">POSICIÓN / EDAD</text>
    <text x="460" y="98" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#34D399">ESTADO MÉDICO</text>
    <text x="660" y="98" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#34D399">RENDIMIENTO</text>
    <text x="800" y="98" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#34D399">RADAR</text>

    <!-- Row 1 -->
    <g transform="translate(20, 120)">
      <line x1="0" y1="50" x2="865" y2="50" stroke="#065F46" stroke-width="1"/>
      <text x="15" y="24" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#ECFDF5">#10 - Morales Kevin</text>
      <text x="15" y="40" font-family="JetBrains Mono, monospace" font-size="10" fill="#6EE7B7">Sub-20 • Capitán</text>
      <text x="240" y="28" font-family="Inter, sans-serif" font-size="12" fill="#D1FAE5">Mediocampista • 19 años</text>
      <rect x="440" y="12" width="115" height="24" rx="12" fill="#065F46" stroke="#10B981" stroke-width="1"/>
      <text x="455" y="28" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#34D399">ALTA MÉDICA</text>
      <text x="640" y="28" font-family="JetBrains Mono, monospace" font-weight="700" font-size="12" fill="#FBBF24">8.9 / 10</text>
      <rect x="780" y="12" width="70" height="26" rx="6" fill="#059669"/>
      <text x="792" y="29" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Ver Ficha</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 180)">
      <line x1="0" y1="50" x2="865" y2="50" stroke="#065F46" stroke-width="1"/>
      <text x="15" y="24" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#ECFDF5">#09 - Benítez Christian</text>
      <text x="15" y="40" font-family="JetBrains Mono, monospace" font-size="10" fill="#6EE7B7">Primera • Delantero</text>
      <text x="240" y="28" font-family="Inter, sans-serif" font-size="12" fill="#D1FAE5">Delantero Centro • 22 años</text>
      <rect x="440" y="12" width="115" height="24" rx="12" fill="#065F46" stroke="#10B981" stroke-width="1"/>
      <text x="455" y="28" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#34D399">ALTA MÉDICA</text>
      <text x="640" y="28" font-family="JetBrains Mono, monospace" font-weight="700" font-size="12" fill="#FBBF24">9.3 / 10</text>
      <rect x="780" y="12" width="70" height="26" rx="6" fill="#059669"/>
      <text x="792" y="29" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Ver Ficha</text>
    </g>
