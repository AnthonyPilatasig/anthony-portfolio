    <script>
      // Counterpart to public/404.html's redirect: restores the real deep-link path
      // (e.g. /anthony-portfolio/proyectos) before React Router reads window.location.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
